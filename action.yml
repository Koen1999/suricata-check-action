name: "Suricata Check"
description: "Run suricata-check to validate rules and highlight issues in Pull Requests."
inputs:
  extra_args:
    description: 'Additional arguments to pass to suricata-check. Provide a space-separated string of flags (e.g., "--include /path/to/rules --issue-severity=WARNING").'
    default: ""
  python_version:
    description: 'The version of Python to use (e.g., "3.14" or "3.x")'
    default: "3.x"
  extra_packages:
    description: 'Additional Python packages to install (comma-separated, e.g., "requests,pandas")'
    default: ""
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
    - name: Install suricata-check
      shell: bash
      run: |
        python -m pip install --upgrade --upgrade-strategy eager pip
        python -m pip install suricata-check[performance]
        if [ -n "${{ inputs.extra_packages }}" ]; then
          PACKAGES=$(echo "${{ inputs.extra_packages }}" | tr ',' ' ')
          python -m pip install $PACKAGES
        fi
    - name: Run suricata-check
      shell: bash
      run: |
        suricata-check --github ${{ inputs.extra_args }}
